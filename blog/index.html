<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clusters — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Source+Serif+4:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#16181A; --ink:#EAE6D8; --ink-soft:#B0AB99; --accent:#8FB2BA; }
  *{ box-sizing:border-box; }
  html{ color-scheme:dark; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Source Serif 4", Georgia, serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap{ max-width:480px; padding:0 28px; text-align:center; }
  .wordmark{ font-family:"Fraunces", serif; font-weight:700; font-size:21px; margin-bottom:32px; }
  h1{ font-family:"Fraunces", serif; font-weight:700; font-size:28px; margin:0 0 16px; }
  p{ color:var(--ink-soft); font-size:16px; line-height:1.6; margin:0 0 28px; }
  a.home{ font-family:"IBM Plex Mono", monospace; font-size:12.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; }
  a.home:hover{ opacity:0.7; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Clusters</div>
    <h1>Blog — coming soon</h1>
    <p>This is a placeholder. Nothing published yet.</p>
    <a class="home" href="../index.html">&larr; Back to clusters.homes</a>
  </div>
</body>
</html>
